name: Deploy to AWS S3

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::977979909790:role/GitHubActionsS3SkillsFrontendDeployRole
          aws-region: us-east-1

      - name: Build project
        run: |
          npm install
          npm run build

      - name: Deploy to S3
        run: |
          aws s3 sync ./dist s3://mk-ai-skills-frontend --delete